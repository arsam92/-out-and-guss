name: Build and deploy OutGuess Web Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Build browser WebAssembly extractor
        run: |
          mkdir -p dist
          GOOS=js GOARCH=wasm go build -trimpath -o dist/outguess.wasm ./cmd/wasm
          cp index.html app.js styles.css dist/
          GOROOT="$(go env GOROOT)"
          if [ -f "$GOROOT/lib/wasm/wasm_exec.js" ]; then cp "$GOROOT/lib/wasm/wasm_exec.js" dist/; else cp "$GOROOT/misc/wasm/wasm_exec.js" dist/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4